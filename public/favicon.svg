<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="zenith-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02070A"/>
      <stop offset="100%" stop-color="#071422"/>
    </linearGradient>
    <linearGradient id="zenith-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0297DE"/>
      <stop offset="100%" stop-color="#0051FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Obsidian Deep Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#zenith-bg)"/>
  <rect width="512" height="512" rx="128" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Glowing Zenith Ring Orb -->
  <circle cx="256" cy="256" r="140" stroke="url(#zenith-ring)" stroke-width="36" filter="url(#glow)"/>
  <!-- Inner Celestial Core Dot -->
  <circle cx="256" cy="256" r="42" fill="#FFFFFF"/>
</svg>
